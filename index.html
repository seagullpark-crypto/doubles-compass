<style>
/* Layout: ベンチで片手操作できる1カラムのノート。上部にチーム名とタブ、本文はカード少なめ・罫線区切り */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#15221e; --muted:#5b6a64; --line:#d6ddd8; --chip:#e6ece8;
  --court:#1e6a54; --court-ink:#ffffff; --ours:#2747a6; --opp:#b0522b; --good:#2d7a47; --warn:#9a6c06;
  --ours-soft:#e3e9fb; --opp-soft:#f8e7df; --court-soft:#dcece5;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --ink:#e4ede9; --muted:#9aaba4; --line:#2a3833; --chip:#21302b;
  --court:#3fa585; --court-ink:#07130f; --ours:#93a9ff; --opp:#e8916a; --good:#6cc48b; --warn:#e0b44a;
  --ours-soft:#1d2645; --opp-soft:#3a2219; --court-soft:#173029; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --ink:#e4ede9; --muted:#9aaba4; --line:#2a3833; --chip:#21302b;
  --court:#3fa585; --court-ink:#07130f; --ours:#93a9ff; --opp:#e8916a; --good:#6cc48b; --warn:#e0b44a;
  --ours-soft:#1d2645; --opp-soft:#3a2219; --court-soft:#173029; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--court);color:var(--court-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.04em}
.brand small{opacity:.85;font-size:12px}
.mode-pill{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;color:inherit;font:inherit;font-size:14px;font-weight:500;padding:8px 12px 10px;opacity:.75;cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{opacity:1;border-bottom-color:currentColor}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--ours);outline-offset:2px}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px;text-wrap:balance;letter-spacing:.02em}
h3{font-size:16px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;font-size:14px;max-width:62ch}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
section.block{border-top:1px solid var(--line);padding-block:18px;display:flex;flex-direction:column;gap:12px}
section.block:first-of-type{border-top:0}
section.block > .btn{align-self:flex-start}
section.block > label.f,.card > label.f{flex:0 0 auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted)}
.stat .note{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 160px}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.btn.ghost{background:transparent}
.btn.small{font-size:12px;padding:4px 10px}
.btn.danger{color:var(--opp)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.chip.ours[aria-pressed="true"]{background:var(--ours);border-color:var(--ours);color:var(--surface)}
.chip.opp[aria-pressed="true"]{background:var(--opp);border-color:var(--opp);color:var(--surface)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.ours{background:var(--ours-soft);color:var(--ours)}
.tag.opp{background:var(--opp-soft);color:var(--opp)}
.tag.court{background:var(--court-soft);color:var(--court)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list .item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.list .item:last-child{border-bottom:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.banner{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--court-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--opp-soft)}

.board{background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.board .side{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .side.r{text-align:right;align-items:flex-end}
.board .nm{font-size:13px;opacity:.8;overflow-wrap:anywhere}
.board .gm{font-family:var(--f-display);font-size:44px;line-height:1}
.board .mid{text-align:center;font-family:var(--f-mono);font-size:13px;opacity:.85}
.board .pt{font-family:var(--f-mono);font-size:26px;font-weight:700;opacity:1;display:block}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtns button{font:inherit;font-family:var(--f-display);font-size:24px;padding:18px 8px;border-radius:12px;border:0;cursor:pointer;color:var(--surface)}
.bigbtns .win{background:var(--ours)}
.bigbtns .lose{background:var(--opp)}
.trail{display:flex;gap:3px;flex-wrap:wrap}
.trail i{width:10px;height:18px;border-radius:2px;display:block}
.trail i.w{background:var(--ours)}
.trail i.l{background:var(--opp)}
.trail i.sep{width:2px;background:var(--line)}
.endcard{border:2px solid var(--court);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.endcard .one{font-family:var(--f-display);font-size:20px;line-height:1.5;color:var(--court)}
.rv{display:flex;flex-direction:column;gap:6px}
.rv label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.verdict{font-weight:700;padding:8px 12px;border-radius:8px}
.verdict.go{background:var(--court-soft);color:var(--court)}
.verdict.mid{background:var(--chip)}
.verdict.stop{background:var(--opp-soft);color:var(--opp)}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.check-cat{display:flex;flex-direction:column;gap:4px}
.check-cat label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:3px 0}
.check-cat .hint{font-size:12px;color:var(--muted);border-left:3px solid var(--court);padding-left:8px;margin-top:2px}
.phrase{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phrase .bad{color:var(--opp);text-decoration:line-through;text-decoration-thickness:1px}
.phrase .good{color:var(--court);font-weight:700}
.phrase .arrow{color:var(--muted)}
@media (max-width:520px){.phrase{grid-template-columns:1fr}.phrase .arrow{display:none}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .mono{min-width:2ch;text-align:center;font-size:18px;font-weight:700}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--court-soft);border-radius:8px;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.quote{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
@media (prefers-reduced-motion:no-preference){.endcard{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

  <div class="wrap">

      <h1>ダブルス・コンパス</h1>

    <nav class="tabs" id="tabs" aria-label="画面"></nav>

</header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

<script>

async function saveDoc(coll,obj,delay=0){
  if(!obj.id)obj.id=uid();
  obj.updatedAt=new Date().toISOString();
  const list=S.data[coll];const i=list.findIndex(x=>x.id===obj.id);
  if(i>=0)list[i]=obj;else list.push(obj);

    // Firestore は書き込み順を自分で守り、オフライン中は端末に貯めて後で送る

/* ============ 試合のスコア計算と指標 ============ */
function score(points,total){
  const need=Math.ceil((total||7)/2);let gA=0,gB=0,pA=0,pB=0,game=0,done=false;const per=[];const gameEnds=[];
  const isFinal=()=>gA===need-1&&gB===need-1;
  for(const p of points){
    if(done){per.push(-1);continue}
    per.push(game);
    if(p.w)pA++;else pB++;
    const tgt=isFinal()?7:4;
    if((pA>=tgt||pB>=tgt)&&Math.abs(pA-pB)>=2){
      if(pA>pB)gA++;else gB++;
      gameEnds.push({idx:per.length-1,won:pA>pB,gA,gB});
      pA=pB=0;game++;
      if(gA>=need||gB>=need)done=true;
    }
  }
  return {gA,gB,pA,pB,game,per,done,final:isFinal()&&!done,need,gameEnds};
}
function callText(sc){
  if(sc.done)return '試合終了';
  if(sc.final)return 'ファイナル '+sc.pA+'-'+sc.pB;
  const {pA,pB}=sc;
  if(pA>=3&&pB>=3){if(pA===pB)return 'デュース';return pA>pB?'アドバンテージ（自）':'アドバンテージ（相）'}
  return pA+'-'+pB;
}
function isOwnMiss(p){return p.end==='前衛のミス'||p.end==='後衛のミス'}
function metrics(points){
  const m={n:points.length,won:0,streaks:[],afterMiss:0,afterMissWon:0,miss:{'設計':0,'実行':0,'情報':0,'成長':0,'未分類':0},
    f:{},b:{},signs:0,signByType:{},ownMiss:0};
  let run=0;
  points.forEach((p,i)=>{
    if(p.w){m.won++;if(run>0){m.streaks.push(run);run=0}}else run++;
    if(isOwnMiss(p)){m.ownMiss++;m.miss[p.miss||'未分類']++;
      if(i+1<points.length){m.afterMiss++;if(points[i+1].w)m.afterMissWon++}}
    if(p.f){m.f[p.f]=m.f[p.f]||{n:0,w:0};m.f[p.f].n++;if(p.w)m.f[p.f].w++}
    if(p.b){m.b[p.b]=m.b[p.b]||{n:0,w:0};m.b[p.b].n++;if(p.w)m.b[p.b].w++}
    (p.s||[]).forEach(s=>{m.signs++;m.signByType[s]=(m.signByType[s]||0)+1});
  });
  if(run>0)m.streaks.push(run);
  m.stop2=m.streaks.length?pct(m.streaks.filter(l=>l<=2).length,m.streaks.length):null;
  m.maxStreak=m.streaks.length?Math.max(...m.streaks):0;
  m.recov=m.afterMiss?pct(m.afterMissWon,m.afterMiss):null;
  m.winRate=pct(m.won,m.n);
  return m;
}
/* エンドチェンジで伝える「ひとつだけ」 — 書籍の原則に基づく判定 */
function oneThing(points,pair){
  const recent=points.slice(-12);const m=metrics(recent);
  let tail=0;for(let i=points.length-1;i>=0&&!points[i].w;i--)tail++;
  const shikakeLoss=recent.filter(p=>p.f==='仕掛ける'&&!p.w).length;
  const out=[];
  if(tail>=3)out.push({t:'流れは止められる。高さでテンポを変え、前衛は静かに立つ',why:`${tail}連続失点中。流れは変えにいくものではなく、落ち着くのを待つもの`});
  if(m.miss['設計']>=2)out.push({t:'選び方を一つに決める：「迷ったら深さ」',why:`直近で設計ミスが${m.miss['設計']}本。打ち方ではなく選び方を直す`});
  if(m.miss['実行']>=2)out.push({t:'ねらいは合っている。強度を一段下げて、同じねらいを続けよう',why:`実行ミスが${m.miss['実行']}本。発想は正しい。再現できる強度へ`});
  if(m.miss['情報']>=2)out.push({t:'ボールより先に、相手の構えを見る',why:`情報ミスが${m.miss['情報']}本。「開いた！」「被った！」のひとり言で読む`});
  if(shikakeLoss>=2)out.push({t:'今はまだ仕掛けない。条件が揃ったら出よう',why:'仕掛けた場面での失点が続いている。待つ前衛が判断の起点'});
  if(m.signs>=4&&m.winRate!=null&&m.winRate<50)out.push({t:'相手は不自由になっている。同じ問いを投げ続けよう',why:`相手の不自由サインが${m.signs}回。崩れは変化より蓄積で起きる`});
  if(m.miss['成長']>=1&&!out.length)out.push({t:'今のミスは挑戦の代償。回数を決めて続けよう',why:'成長ミスは悪いミスではない。ただし無制限には許さない'});
  if(!out.length){
    if(m.winRate!=null&&m.winRate>=55)out.push({t:'相手が変えるまで、自分たちは変えない',why:'有利な条件は続ける。変えるべきは相手が慣れた瞬間'});
    else out.push({t:pair&&pair.modoru?('戻る形：'+pair.modoru):'深さで整えて、2本整えてから勝負',why:'迷ったら、決めてある形へ戻る'});
  }
  return out[0];
}

function topSign(M){const e=Object.entries(M.signByType).sort((a,b)=>b[1]-a[1])[0];return e?'最多：'+e[0]:'記録なし'}
function flowChart(pts,sc){
  if(!pts.length)return '<p class="muted">ポイントがありません。</p>';
  const W=640,H=180,pad=28;const n=pts.length;const step=(W-pad*2)/Math.max(n,1);
  let cum=0;const cums=pts.map(p=>cum+=p.w?1:-1);
  const mx=Math.max(3,...cums.map(Math.abs));const y=v=>H/2-(v/mx)*(H/2-pad);
  let bars='',line='';
  pts.forEach((p,i)=>{const x=pad+i*step;bars+=`<rect x="${x+step*.15}" y="${p.w?H-pad-14:H-pad-6}" width="${Math.max(step*.7,1)}" height="${p.w?14:6}" fill="${p.w?'var(--ours)':'var(--opp)'}" rx="1"/>`});
  line=cums.map((v,i)=>`${i?'L':'M'}${(pad+i*step+step/2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let seps='';sc.gameEnds.forEach((g,k)=>{const x=pad+(g.idx+1)*step;seps+=`<line x1="${x}" x2="${x}" y1="${pad-10}" y2="${H-pad}" class="axis" stroke-dasharray="2 3"/><text x="${x-step*0}" y="${pad-14}" text-anchor="end">${g.gA}-${g.gB}</text>`});
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="ポイントの流れ"><line x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}" class="axis"/>${seps}${bars}<path d="${line}" fill="none" stroke="var(--muted)" stroke-width="2"/><circle cx="${pad+(n-1)*step+step/2}" cy="${y(cums[n-1])}" r="4" fill="var(--ink)"/><text x="${pad}" y="${H-6}">1本目</text><text x="${W-pad}" y="${H-6}" text-anchor="end">${n}本目</text></svg></div>`;
}

function stepper(path,val){return `<div class="stepper"><button type="button" data-step="${path}" data-d="-1" aria-label="減らす">−</button><span class="mono">${val}</span><button type="button" data-step="${path}" data-d="1" aria-label="増やす">＋</button></div>`}

function growthChart(list){
  if(list.length<2)return '<p class="muted" style="font-size:13px">2回以上記録すると、基準線が表示されます。</p>';
  const W=640,H=200,pad=30;const vals=list.map(procScore);const n=vals.length;
  const mx=Math.max(4,...vals);const x=i=>pad+i*(W-pad*2)/(n-1);const y=v=>H-pad-(v/mx)*(H-pad*2);
  const avg=vals.map((v,i)=>{const s=vals.slice(Math.max(0,i-2),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
  let g='';for(let t=0;t<=mx;t+=Math.ceil(mx/4)){g+=`<line x1="${pad}" x2="${W-pad}" y1="${y(t)}" y2="${y(t)}" class="axis" stroke-dasharray="2 4"/><text x="${pad-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`}
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"><title>${esc(list[i].date)}：${v}</title></circle>`).join('');
  const wave=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
  const base=avg.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
  const area=base+` L${x(n-1)},${H-pad} L${x(0)},${H-pad} Z`;
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="過程スコアの推移">${g}<path d="${area}" fill="var(--court-soft)"/><path d="${wave}" fill="none" stroke="var(--line)" stroke-width="1.5"/><path d="${base}" fill="none" stroke="var(--court)" stroke-width="3" stroke-linecap="round"/>${dots}<circle cx="${x(n-1)}" cy="${y(avg[n-1])}" r="5" fill="var(--court)"/><text x="${pad}" y="${H-8}">${esc(list[0].date)}</text><text x="${W-pad}" y="${H-8}" text-anchor="end">${esc(list[n-1].date)}</text></svg></div>`;
}

  if(mine.length)h+=`<section class="block"><h3>履歴</h3><div class="scroll"><table class="t"><thead><tr><th>日付</th><th>つけた人</th>${CHECK.map(c=>`<th>${c.c}</th>`).join('')}<th></th></tr></thead><tbody>${mine.slice().reverse().map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.by)}</td>${CHECK.map((_,i)=>`<td class="n">${catScore(c,i)}/5</td>`).join('')}<td><button class="btn small danger" data-delcheck="${c.id}">削除</button></td></tr>`).join('')}</tbody></table></div></section>`;
  return h;
}
function catScore(c,i){return (c.v&&c.v[i]||[]).filter(Boolean).length}
function radar(a,b){
  const W=300,H=280,cx=150,cy=140,R=100;const N=5;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(ang)*r,cy+Math.sin(ang)*r]};
  let g='';[1,2,3,4,5].forEach(l=>{g+=`<polygon points="${[...Array(N)].map((_,i)=>pt(i,R*l/5).join(',')).join(' ')}" fill="none" class="axis"/>`});
  [...Array(N)].forEach((_,i)=>{const [x,y]=pt(i,R);const [lx,ly]=pt(i,R+22);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="axis"/><text x="${lx}" y="${ly+4}" text-anchor="middle">${CHECK[i].c}</text>`});
  const poly=(c,col)=>c?`<polygon points="${CHECK.map((_,i)=>pt(i,R*catScore(c,i)/5).join(',')).join(' ')}" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="2"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:340px" role="img" aria-label="5領域のレーダー">${g}${poly(b,'var(--opp)')}${poly(a,'var(--ours)')}</svg>`;
}
function gapList(a,b){
  const weak=[];const gaps=[];
  CHECK.forEach((c,i)=>c.items.forEach((it,j)=>{
    const sa=a?!!(a.v[i]||[])[j]:null,sb=b?!!(b.v[i]||[])[j]:null;
    if(a&&b&&sa!==sb)gaps.push({c:c.c,it,self:sa});
    if((a&&!sa)&&(b?!sb:true))weak.push({c:c.c,it,hint:c.hint});
  }));
  let h='';
  if(a&&b)h+=`<h3>本人と監督で見え方が違う項目（${gaps.length}）</h3>`+(gaps.length?`<ul style="margin:0 0 12px;padding-left:18px;font-size:14px">${gaps.slice(0,6).map(g=>`<li><span class="tag">${g.c}</span> ${esc(g.it)}<br><span class="muted" style="font-size:12px">${g.self?'本人はできている、監督はまだと見ている':'監督はできている、本人はまだと感じている'}</span></li>`).join('')}</ul><p class="muted" style="font-size:12px;margin:0 0 12px">このズレが対話の入口になります。正しさを決めるより、何が見えていたかを聞く。</p>`:'<p class="muted">大きなズレはありません。</p>');
  h+=`<h3>設計が必要な部分</h3>`+(weak.length?`<ul style="margin:0;padding-left:18px;font-size:14px">${weak.slice(0,5).map(w=>`<li><span class="tag">${w.c}</span> ${esc(w.it)}</li>`).join('')}</ul>`:'<p class="muted">すべてに□がついています。</p>');
  return h;
}

/* ============ AI（Claude）への相談 ============ */
const BOOK_PRINCIPLES=`あなたはソフトテニス指導書『復元力』（朴相俊 著）の考え方で助言するコーチ補佐です。原則：
- 技術は「正しさ」より「再現性」。崩れても戻れる「戻り道」を設計する。ねらい（意図）を揃える。
- 前衛は点を取る人ではなく相手の選択肢を歪める人。60点の関与。守る/待つ/消す/仕掛けるの4モード。出られなかった自分を責めない。
- 後衛は展開を選び続ける判断。続ける/変える/時間をつくる/主導権の4モード。深さ→速さ→高さの優先順位。
- ミスは設計・実行・情報・成長の4種類で読む。
- メンタルは才能ではなく設計。自信ではなく信頼。切り替えではなく時間の分離（今やること／あとでやること）。
- 声かけは気合いではなく行動を選べる形に整える言葉。「気持ちで負けるな」「切り替えろ」等は使わない。短く、評価より安全基地。
- 努力は直線ではない。結果ではなく過程（戻れた回数など）を評価する。
日本語で、高校生にも伝わる短い言葉で答えてください。`;
async function askAI(prompt,outEl){
  if(!S.sample){outEl.innerHTML='';return}
  outEl.innerHTML='<div class="ai-out">考えています…</div>';const box=outEl.firstChild;
  try{
    const r=await S.sample(BOOK_PRINCIPLES+'\n\n'+prompt,{onText:({text})=>{box.textContent=text},modelTier:'quick'});
    box.textContent=r.text;
  }catch(e){
    if(e&&e.code==='not_granted'){outEl.innerHTML='';S.sample=null;render();return}
    box.textContent=e&&e.code==='rate_limited'?'少し時間をおいてから試してください。':'今は答えを受け取れませんでした。';
  }
}
function matchDigest(m){
  const M=metrics(m.points||[]);const sc=score(m.points||[],m.games);
  return `スコア ${sc.gA}-${sc.gB}（${sc.need*2-1}ゲームマッチ）、ポイント取得率${M.winRate}%、連続失点ストップ率${M.stop2}%、最長連続失点${M.maxStreak}、ミス後の復帰率${M.recov}%。自分たちのミス内訳：${Object.entries(M.miss).map(e=>e[0]+e[1]).join('、')}。前衛モード：${Object.entries(M.f).map(([k,o])=>k+o.w+'/'+o.n).join('、')||'記録なし'}。後衛モード：${Object.entries(M.b).map(([k,o])=>k+o.w+'/'+o.n).join('、')||'記録なし'}。相手の不自由サイン${M.signs}回。ズレ・ログ：${(m.zure||[]).map(z=>z.t).join('／')||'なし'}。`;
}

    if(rnd()<.35)p.s=[pick(SIGNS)];pts.push(p)}return pts};

  refl.push({id:'ex-rf',sample:true,date:'2026-10-26',player:p1.id,matchId:m2.id,role:'前衛',nerai:'相手後衛の逆クロスを消し続ける',miss:{'設計':1,'実行':1,'情報':2,'成長':1},proc:{modoreta:2,onaji:2,ippo:1},cond:{out:3,acc:3,judge:3},front:{mamoreta:'センターを締めて抜かれなかった',riyuu:'相手の構えが強く、味方後衛も苦しかった',joken:'相手後衛の打点が遅れたら'},mamotta:'出られなかった後も位置選定を続けた',next:'「被った！」のひとり言で構えを読む',coach:''});

function chipClick(name,val){
  const m=curMatch();
  if(m&&['end','miss','f','b','s'].includes(name)){
    const p=m.points[m.points.length-1];if(!p)return;
    if(name==='s'){p.s=p.s||[];p.s=p.s.includes(val)?p.s.filter(x=>x!==val):p.s.concat(val)}
    else{p[name]=p[name]===val?'':val;if(name==='end'&&!isOwnMiss(p))delete p.miss}
    saveDoc('matches',m,800);render();return}
  if(PAIR_DRAFT){
    if(name.startsWith('own-')){PAIR_DRAFT.owners[name.slice(4)]=val;render();return}
    if(name==='rule'){const r=PAIR_DRAFT.rules;PAIR_DRAFT.rules=r.includes(val)?r.filter(x=>x!==val):r.concat(val);render();return}
    if(name==='word'){const r=PAIR_DRAFT.aikotoba;PAIR_DRAFT.aikotoba=r.includes(val)?r.filter(x=>x!==val):r.concat(val);render();return}
  }
  if(name==='role'&&REFL){REFL.role=val;render();return}
  if(name==='ckby'){UI.checkBy=val;CHK=null;render();return}
  if(name==='np-pos'){NP.pos=val;render();return}
}

/* ============ チーム同期の画面 ============ */
let JOIN_CODE='';
function teamSection(){
  let body;
  if(S.mode==='team'){
    body=`<div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">チームコード</span>
      <span class="mono" style="font-size:22px;font-weight:700;letter-spacing:.06em">${esc(S.team)}</span>
      <div class="row"><button class="btn small" data-copy="${esc(S.team)}">コードをコピー</button></div>
      <p class="muted" style="font-size:12px;margin:0">このコードを入れた端末どうしで、選手・試合・振り返り・チェックが自動でそろいます。<b>コードはチームの鍵です。</b>監督と選手以外には教えないでください。</p></div>
      <details><summary>チームから抜ける</summary><p class="muted" style="font-size:13px">この端末は同期をやめ、今の記録を端末に残します。チームのデータは消えません。</p><button class="btn danger" id="leaveTeam">チームから抜ける</button></details>`;
  }else if(!FIREBASE_CONFIG){
    body=`<p class="muted" style="font-size:13px;margin:0">同期機能は準備中です（管理者がサーバーの設定を終えると使えるようになります）。それまではファイルの受け渡しで記録をそろえてください。</p>`;
  }else{
    body=`<div class="grid g2">
      <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0">チームに参加する</h3><p class="muted" style="font-size:13px;margin:0">ほかの監督から受け取った16文字のコードを入れます。</p>
        <input type="text" id="joinCode" value="${esc(JOIN_CODE)}" placeholder="例：K7QM-2XPA-9HTW-R4NB" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="joinTeam" style="align-self:flex-start">参加する</button></div>
      <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0">新しいチームを作る</h3><p class="muted" style="font-size:13px;margin:0">最初の1人だけが行います。この端末の記録はそのままチームに引き継がれます。</p>
        <button class="btn" id="createTeam" style="align-self:flex-start">チームを作る</button></div></div>`;
  }
  return `<section class="block"><h3>チーム同期</h3>${body}</section>`;
}

/* ============ PWA：インストール・バックアップ ============ */
let installEvt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(route==='team')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('ホーム画面に追加しました');if(route==='team')render()});
function installSection(){
  if(isStandalone())return `<section class="block"><h3>アプリ</h3><p class="muted" style="font-size:13px;margin:0">ホーム画面のアプリとして起動しています。電波のないコートでも使えます。</p></section>`;
  let body;
  if(installEvt)body=`<button class="btn primary" id="installApp">このアプリをインストール</button>`;
  else if(isIOS)body=`<ol style="margin:0;padding-left:20px;font-size:14px"><li>Safariの下にある共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol>`;
  else body=`<p style="font-size:14px;margin:0">ブラウザのメニュー（︙）から「アプリをインストール」または「ホーム画面に追加」を選んでください。</p>`;
  return `<section class="block"><h3>ホーム画面に追加</h3>${body}<p class="muted" style="font-size:12px;margin:0">追加すると全画面で起動し、オフラインでも使えます。</p></section>`;
}
function backupJSON(){return JSON.stringify({app:'doubles-compass',version:1,exportedAt:new Date().toISOString(),team:UI.teamName,data:S.data},null,1)}
async function exportData(){
  const name='doubles-compass-'+today()+'.json';
  const file=new File([backupJSON()],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'ダブルス・コンパスのデータ'})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    lsSet('fk-backup-at',new Date().toISOString());toast('書き出しました');render();
  }catch(e){if(e&&e.name==='AbortError')return;toast('書き出せませんでした')}
}
async function importData(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('ファイルを読み取れませんでした');return}
  if(!j||j.app!=='doubles-compass'||!j.data){toast('ダブルス・コンパスのファイルではありません');return}
  let added=0,updated=0;const changed=[];
  COLLS.forEach(k=>{(j.data[k]||[]).forEach(x=>{if(!x||!x.id)return;
    const i=S.data[k].findIndex(y=>y.id===x.id);
    if(i<0){S.data[k].push(x);added++;changed.push([k,x])}
    else if((x.updatedAt||'')>(S.data[k][i].updatedAt||'')){S.data[k][i]=x;updated++;changed.push([k,x])}
  })});
  if(!UI.teamName&&j.team){UI.teamName=j.team;lsSet('fk-team',j.team)}
  if(S.mode==='team'){for(const [k,x] of changed)await saveDoc(k,x)}
  else lsSet(LS_KEY,S.data);
  toast(`読み込みました（追加${added}件・更新${updated}件）`);render();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='exportData')exportData();
  if(t.id==='importBtn')$('#importFile').click();
  if(t.id==='createTeam'){t.disabled=true;try{await createTeam()}catch(err){t.disabled=false;toast('チームを作れませんでした。通信を確認してください')}}
  if(t.id==='joinTeam'){t.disabled=true;try{await joinTeam(JOIN_CODE)}catch(err){t.disabled=false;toast('参加できませんでした。通信を確認してください')}}
  if(t.id==='leaveTeam')leaveTeam();
  if(t.id==='mergeLocal')mergeLocalIntoTeam();
  if(t.id==='skipMerge'){S.pendingMerge=null;render()}
  if(t.id==='installApp'&&installEvt){installEvt.prompt();await installEvt.userChoice;installEvt=null;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}});
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

render();
initStore();
</script>
</body>
</html>
